name: Coverage (main)

'on':
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-publisher:
    environment: codescene
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      MARKDOWNLINT_CLI2_VERSION: '0.22.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@872f59f53717b5bebe8e24b2f4a7496b089a939a
        with:
          install-mold: 'true'
          rustflags: ''
      - name: Install clang linker driver
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update \
            && sudo apt-get install --yes --no-install-recommends clang
      - name: Check build tools
        run: make check-build-tools
      # The suite includes golden and formatter-boundary tests that run
      # mdtablefix and markdownlint-cli2 as subprocesses, as in ci.yml.
      - name: Install mdtablefix
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@872f59f53717b5bebe8e24b2f4a7496b089a939a
        with:
          version: '0.6.1'
      - name: Install the golden-test Markdown linter
        env:
          MARKDOWNLINT_CLI2_VERSION: ${{ env.MARKDOWNLINT_CLI2_VERSION }}
        run: |
          set -euo pipefail

          npm_root="$HOME/.local/share/mapsplice/markdown-formatters/npm"
          mkdir -p "$npm_root/bin"
          echo "$npm_root/bin" >> "$GITHUB_PATH"
          npm install --global --prefix "$npm_root" \
            "markdownlint-cli2@$MARKDOWNLINT_CLI2_VERSION"
          "$npm_root/bin/markdownlint-cli2" --version
      - name: Generate coverage
        env:
          RUSTFLAGS: '-D warnings'
        uses: leynos/shared-actions/.github/actions/generate-coverage@872f59f53717b5bebe8e24b2f4a7496b089a939a
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
          publish-artefact: 'false'
      - name: Check CodeScene token
        id: codescene-token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Report skipped CodeScene upload
        if: steps.codescene-token.outputs.available != 'true'
        run: echo "::warning::CodeScene coverage was not published because the environment token is unavailable."
      - name: Upload coverage data to CodeScene
        if: steps.codescene-token.outputs.available == 'true' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@872f59f53717b5bebe8e24b2f4a7496b089a939a
        with:
          path: lcov.info
          format: lcov
          mode: upload
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
