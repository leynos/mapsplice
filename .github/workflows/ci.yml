name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      WHITAKER_INSTALLER_VERSION: '0.2.6'
      MARKDOWNLINT_CLI2_VERSION: '0.22.1'
      MERMAN_CLI_VERSION: '0.8.0-alpha.2'
      NIXIE_CLI_VERSION: '1.1.0'
      NIXIE_PYTHON_VERSION: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@95e90ba9e33eaeb3c8b4bf6ed1dbe1d7184ee710
      - name: Install mold linker
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update \
            && sudo apt-get install --yes --no-install-recommends clang mold
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@c5a54701c8603a0fa756a6b34c49bc2af75a6c11
        with:
          version: "0.6.0"
      - name: Format
        run: make check-fmt
      - name: Typecheck
        run: make typecheck
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: '**/*.md'
      - name: Install Mermaid validators
        run: |
          uv tool install --python "${{ env.NIXIE_PYTHON_VERSION }}" --managed-python "nixie-cli==${{ env.NIXIE_CLI_VERSION }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cargo binstall --no-confirm merman-cli@${{ env.MERMAN_CLI_VERSION }}
      - name: Mermaid diagrams
        run: make nixie
      - name: Cache the golden-test Markdown linter
        id: cache-markdown-formatters
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.local/share/mapsplice/markdown-formatters
          key: markdown-formatters-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.MARKDOWNLINT_CLI2_VERSION }}
      # The Markdown gate itself runs through the pinned
      # markdownlint-cli2-action above; this installs the same linter as an
      # executable because the golden and formatter-boundary tests
      # (tests/golden/format_gate.rs, tests/support/formatter_boundary.rs) run
      # it as a subprocess. mdtablefix comes from the pinned install step above.
      - name: Install the golden-test Markdown linter
        env:
          MARKDOWNLINT_CLI2_VERSION: ${{ env.MARKDOWNLINT_CLI2_VERSION }}
        run: |
          set -euo pipefail

          formatter_root="$HOME/.local/share/mapsplice/markdown-formatters"
          npm_root="$formatter_root/npm"

          mkdir -p "$npm_root/bin"
          export PATH="$npm_root/bin:$PATH"
          echo "$npm_root/bin" >> "$GITHUB_PATH"

          if [ ! -x "$npm_root/bin/markdownlint-cli2" ]; then
            npm install --global --prefix "$npm_root" \
              "markdownlint-cli2@$MARKDOWNLINT_CLI2_VERSION"
          fi
          markdownlint-cli2 --version
      - name: Cache Whitaker installation
        id: cache-whitaker
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/bin/whitaker-installer
            ~/.local/bin/whitaker
            ~/.dylint_drivers
            ~/.local/share/whitaker
          key: whitaker-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.WHITAKER_INSTALLER_VERSION }}
      - name: Install Whitaker
        run: |
          if ! command -v whitaker-installer >/dev/null 2>&1; then
            if cargo binstall --version >/dev/null 2>&1; then
              cargo binstall --no-confirm --locked "whitaker-installer@${WHITAKER_INSTALLER_VERSION}"
            else
              echo "cargo-binstall unavailable; building whitaker-installer from crates.io"
              cargo install --locked whitaker-installer --version "${WHITAKER_INSTALLER_VERSION}"
            fi
          fi
          whitaker-installer --cranelift
      - name: Lint
        run: make lint
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Spelling
        run: make spelling
      - name: Workflow contract tests
        run: make test-workflow-contracts
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@95e90ba9e33eaeb3c8b4bf6ed1dbe1d7184ee710
        with:
          output-path: lcov.info
          format: lcov
      - name: Upload coverage data to CodeScene
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: ${{ env.CS_ACCESS_TOKEN }}
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@95e90ba9e33eaeb3c8b4bf6ed1dbe1d7184ee710
        with:
          format: lcov
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}
