name: Mutation testing

# Thin caller of the shared mutation-testing reusable workflow; caller
# guide: leynos/shared-actions docs/mutation-cargo-workflow.md.
# Scheduled runs mutate only files changed within the detection window;
# manual dispatch runs mutate everything, fanned out across shards. To
# test a branch, select it in the Actions "Run workflow" control.

on:
  schedule:
    - cron: "50 3 * * *" # Daily, 03:50 UTC
  workflow_dispatch:

# Default the token to no scopes; the job opts in explicitly.
permissions: {}

# Serialize runs per ref: a dispatch during a scheduled run (or vice
# versa) queues rather than racing. Runs are informational, so queued
# runs wait instead of cancelling.
concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    permissions:
      contents: read
      id-token: write # OIDC workflow-source resolution
    uses: leynos/shared-actions/.github/workflows/mutation-cargo.yml@e693d81d176d2305e2b736a0be0f9038085dec7f
    with:
      # .cargo/config.toml links with `mold` on Linux; the reusable workflow installs it.
      install-mold: 'true'
      # Match the CI baseline (`make test` runs --workspace --all-targets
      # --all-features) so the test command exercised against mutants
      # mirrors what gates pull requests.
      extra-args: "--all-features"
      install-mdtablefix: 'true'
      mdtablefix-version: "0.6.1"
      # The golden round-trip baseline starts both formatters through PATH.
      # This preflight runs before mutation enumeration and the baseline.
      # The reusable workflow runs this before cargo-mutants. Its setup-rust
      # default assigns warnings-only RUSTFLAGS, so restate development flags
      # for the later step after installing the same pinned linker locally.
      setup-commands: |
        npm_root="$RUNNER_TEMP/mapsplice-markdown-tools"
        mkdir -p "$npm_root/bin"
        npm install --global --prefix "$npm_root" markdownlint-cli2@0.22.1
        export PATH="$npm_root/bin:$PATH"
        echo "$npm_root/bin" >> "$GITHUB_PATH"
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends clang
        make install-build-tools
        export PATH="$HOME/.local/bin:$PATH"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        make check-build-tools
        # The baseline contract checks require Make's cargo-nextest route.
        # Verify the pinned upstream binary before adding it to PATH.
        nextest_version=0.9.148
        nextest_sha256=223ba936714cc861a9cdedad5a8eb664dfdd69d6fbdf6cea6aa8184f523290dc
        nextest_release="https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$nextest_version"
        nextest_archive_name="cargo-nextest-$nextest_version-x86_64-unknown-linux-gnu.tar.gz"
        nextest_archive="$RUNNER_TEMP/$nextest_archive_name"
        nextest_url="$nextest_release/$nextest_archive_name"
        curl --fail --location --retry 3 --silent --show-error \
          --output "$nextest_archive" "$nextest_url"
        printf '%s  %s\n' "$nextest_sha256" "$nextest_archive" \
          | sha256sum --check --status
        nextest_bin="$RUNNER_TEMP/mapsplice-nextest/bin"
        mkdir -p "$nextest_bin"
        tar -xzf "$nextest_archive" -C "$nextest_bin" cargo-nextest
        export PATH="$nextest_bin:$PATH"
        echo "$nextest_bin" >> "$GITHUB_PATH"
        case "$(cargo nextest --version)" in
          "cargo-nextest $nextest_version"*) ;;
          *)
            echo "mutation setup: expected cargo-nextest $nextest_version" >&2
            exit 1
            ;;
        esac
        MDTABLEFIX_REQUIRED_VERSION=0.6.1 \
        MARKDOWNLINT_CLI2_REQUIRED_VERSION=0.22.1 \
        make check-markdown-tools
        echo 'RUSTFLAGS=-D warnings -Zthreads=8 -C link-arg=-fuse-ld=mold' >> "$GITHUB_ENV"
