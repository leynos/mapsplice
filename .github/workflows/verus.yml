name: Verus

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# A push to a pull request supersedes the run already in flight, and there is
# nothing left to learn from the superseded one. Cancellation is conditioned
# on the event so a hand-run dispatch, which has no successor waiting, always
# runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@82feb2b7aac45b7efff40c9c4bb632551b14521c
      # The shared action installs the Verus release named in
      # `tools/verus/VERSION`, and the Z3 solver beside it, through the pinned
      # rust-prover-tools. It checks the digest in `tools/verus/SHA256SUMS` and
      # caches the verified archives. The Make targets below install nothing.
      - name: Install Verus
        uses: leynos/shared-actions/.github/actions/install-prover-tools@a0519a1476ab769ca7b8badfa794f3751213f1ea
        with:
          tools: verus
          runner-image: ubuntu2404
      # The proofs, and the check that the verifier rejects a proof it should.
      # Both are required: a run whose verifier never started reports success
      # on the first step and failure on the second.
      - name: Verify proofs
        run: make verus
      - name: Verify the harness rejects false proofs
        run: make verus-selftest
