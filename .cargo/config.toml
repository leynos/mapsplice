[build]
rustflags = ["-Zthreads=8"]

# Explicit LLVM profile overrides protect coverage and Whitaker from inherited
# backend settings; enabling this Cargo feature does not select Cranelift.
[unstable]
codegen-backend = true

# Cargo uses a matching target's rustflags instead of merging [build].rustflags.
# Keep the parallel frontend in both supported Linux linker routes.
[target.x86_64-unknown-linux-gnu]
linker = "scripts/clang-mold.sh"
rustflags = ["-Zthreads=8", "-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
linker = "scripts/clang-mold.sh"
rustflags = ["-Zthreads=8", "-C", "link-arg=-fuse-ld=mold"]
