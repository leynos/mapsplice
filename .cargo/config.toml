[build]
rustflags = ["-Zthreads=8"]

# Development builds use LLVM, the estate standard. The Cranelift selection is
# disabled (14 November 2026; review due 14 May 2027) and the unstable key stays
# so an opt-in `--config 'profile.dev.codegen-backend="cranelift"'` still works.
[unstable]
embed-metadata = false
codegen-backend = true

# [profile.dev]
# codegen-backend = "cranelift"

[target.x86_64-unknown-linux-gnu]
linker = "scripts/clang-linker.sh"

[target.aarch64-unknown-linux-gnu]
linker = "scripts/clang-aarch64-linker.sh"

# `mold` ships for Linux only, so the linker flag lives in a Linux-only table. A `cfg` table
# matches every Linux target, not one architecture; the triple tables above keep only the
# linker. Other targets, macOS and Windows included, fall through to `[build] rustflags`.
[target.'cfg(target_os = "linux")']
rustflags = ["-Zthreads=8", "-C", "link-arg=-fuse-ld=mold"]
