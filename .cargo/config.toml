[build]
rustflags = ["-Zthreads=8"]

# Explicit LLVM profile overrides protect coverage and Whitaker from inherited
# backend settings; enabling this Cargo feature does not select Cranelift.
[unstable]
codegen-backend = true

[target.x86_64-unknown-linux-gnu]
linker = "scripts/clang-linker.sh"

[target.aarch64-unknown-linux-gnu]
linker = "scripts/clang-aarch64-linker.sh"

# `mold` ships for Linux only, so the linker flag lives in a Linux-only table. A `cfg` table
# matches every Linux target, not one architecture; the triple tables above keep only the
# linker. Other targets, macOS and Windows included, fall through to `[build] rustflags`.
[target.'cfg(target_os = "linux")']
rustflags = ["-Zthreads=8", "-C", "link-arg=-fuse-ld=mold"]
